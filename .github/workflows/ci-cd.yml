name: CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "terraform/**"
      - "scripts/**"
      - "lambda-layers/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main, dev, 'integration/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]

# Never interrupt Terraform midway through applying a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      platform: kalibrr,glints,jobstreet,dealls,techinasia
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.4
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run offline tests
        run: poetry run pytest tests --tb=short

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            poetry.lock
            lambda-layers/**/requirements.txt
      - name: Build Linux ZIPs, enforce 250 MB limits and smoke test native dependencies
        run: python scripts/build_lambda_packages.py
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform format and validate both environments
        run: |
          terraform fmt -check -recursive terraform
          for env in dev prod; do
            terraform -chdir=terraform/envs/$env init -backend=false -input=false
            terraform -chdir=terraform/envs/$env validate
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            .lambda-build/*.zip
            .lambda-build/manifest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: [test, package]
    if: github.event_name != 'pull_request'
    environment: ${{ (inputs.environment == 'prod' || (!inputs.environment && github.ref_name == 'main')) && 'main_env' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      DEPLOY_ENV: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: .lambda-build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335315755:role/jobscraper-github-actions-role
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform -chdir=terraform/envs/$DEPLOY_ENV init -input=false
      - name: Plan ZIP functions, layers, S3 artifacts and orchestration
        run: terraform -chdir=terraform/envs/$DEPLOY_ENV plan -input=false -var="env=$DEPLOY_ENV" -out=deployment.tfplan
      - name: Apply the reviewed-by-CI plan
        run: terraform -chdir=terraform/envs/$DEPLOY_ENV apply -input=false deployment.tfplan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment SDK
        run: pip install boto3==1.42.53
      - name: Install Athena views for the deployed environment
        run: python scripts/deploy_athena_views.py --environment "$DEPLOY_ENV"
