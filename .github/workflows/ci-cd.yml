name: CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "terraform/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pip install poetry
      - name: Cache poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest --tb=short

  deploy-prod:
    name: "\U0001F680 Prod"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref_name == 'main'
    environment: main_env
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335315755:role/jobscraper-github-actions-role
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3

      # ── Phase 1: Infra only (no image needed) ──
      - name: Terraform Init
        run: terraform -chdir=terraform/envs/prod init
      - name: "Phase 1: Infra (S3, IAM, SSM, ECR, CloudWatch, Glue)"
        run: |
          terraform -chdir=terraform/envs/prod apply -var="env=prod" -auto-approve \
            -target=module.base.aws_s3_bucket.bronze \
            -target=module.base.aws_s3_bucket.silver \
            -target=module.base.aws_s3_bucket_public_access_block.bronze \
            -target=module.base.aws_s3_bucket_public_access_block.silver \
            -target=module.base.aws_iam_role.lambda_exec_role \
            -target=module.base.aws_iam_role.step_functions_role \
            -target=module.base.aws_iam_role.slack_lambda_role \
            -target=module.base.aws_ssm_parameter.slack_webhook_url \
            -target=module.base.aws_ecr_repository.scraper_repo \
            -target=module.base.aws_ecr_lifecycle_policy.cleanup \
            -target=module.base.aws_cloudwatch_log_group.step_functions_logs \
            -target=module.base.aws_glue_catalog_database.jobscraper_db \
            -target=module.base.aws_dynamodb_table.terraform_lock

      # ── Phase 2: Build & Push Docker image ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Install Slack Alert Layer dependencies
        run: |
          pip install -r lambda-layers/slack-alert-layer/requirements.txt \
            -t lambda-layers/slack-alert-layer/python/lib/python3.12/site-packages/ \
            --no-cache-dir
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          provenance: false
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/job-scraper-lambda:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Phase 3: Lambda + Step Functions ──
      - name: "Phase 3: Lambda & Orchestration"
        run: terraform -chdir=terraform/envs/prod apply -var="env=prod" -auto-approve

  deploy-dev:
    name: "\U0001F9EA Dev"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref_name == 'dev'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335315755:role/jobscraper-github-actions-role
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3

      # ── Phase 1: Infra only (no image needed) ──
      - name: Terraform Init
        run: terraform -chdir=terraform/envs/dev init
      - name: "Phase 1: Infra (S3, IAM, SSM, ECR, CloudWatch, Glue)"
        run: |
          terraform -chdir=terraform/envs/dev apply -var="env=dev" -auto-approve \
            -target=module.base.aws_s3_bucket.bronze \
            -target=module.base.aws_s3_bucket.silver \
            -target=module.base.aws_s3_bucket_public_access_block.bronze \
            -target=module.base.aws_s3_bucket_public_access_block.silver \
            -target=module.base.aws_iam_role.lambda_exec_role \
            -target=module.base.aws_iam_role.step_functions_role \
            -target=module.base.aws_iam_role.slack_lambda_role \
            -target=module.base.aws_ssm_parameter.slack_webhook_url \
            -target=module.base.aws_ecr_repository.scraper_repo \
            -target=module.base.aws_ecr_lifecycle_policy.cleanup \
            -target=module.base.aws_cloudwatch_log_group.step_functions_logs \
            -target=module.base.aws_glue_catalog_database.jobscraper_db \
            -target=module.base.aws_dynamodb_table.terraform_lock

      # ── Phase 2: Build & Push Docker image ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Install Slack Alert Layer dependencies
        run: |
          pip install -r lambda-layers/slack-alert-layer/requirements.txt \
            -t lambda-layers/slack-alert-layer/python/lib/python3.12/site-packages/ \
            --no-cache-dir
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          provenance: false
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/job-scraper-lambda-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Phase 3: Lambda + Step Functions ──
      - name: "Phase 3: Lambda & Orchestration"
        run: terraform -chdir=terraform/envs/dev apply -var="env=dev" -auto-approve
